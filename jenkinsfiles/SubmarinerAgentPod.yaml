apiVersion: v1
kind: Pod
metadata:
  labels:
    label: submariner
spec:
  activeDeadlineSeconds: 18000
  containers:
  - name: jnlp
    image: "images.paas.redhat.com/skynet-qe/main-jenkins-agent:latest"
    workingDir: '/home/jenkins'
    env:
      - name: HOME
        value: '/home/jenkins'
      - name: http_proxy
        value: 'http://squid.corp.redhat.com:3128'
      - name: https_proxy
        value: 'http://squid.corp.redhat.com:3128'
      - name: no_proxy
        value: '.redhat.com,.corp.redhat.com,.cee.redhat.com,.svc,.cluster.local,localhost,127.0.0.1,172.31.0.0/16,10.0.0.0/8,169.254.169.254,.itup.redhat.com,.psi.redhat.com'
    resources:
      limits:
        cpu: 100m
        memory: 300Mi
      requests:
        cpu: 50m
        memory: 256Mi
  - name: submariner
    image: 'quay.io/maxbab/subm-test@sha256:de12a7c01d98fac271e427b0a797db8bceb89e8ba6765c041e1fcb9c8b043695'
    # imagePullSecrets: 'agent-image-secret'
    ttyEnabled: true
    alwaysPullImage: true
    command: [ 'sleep', '365d' ]
    workingDir: '/home/jenkins'
    env:
      - name: HOME
        value: '/home/jenkins'
      - name: ANSIBLE_COLLECTIONS_PATHS
        value: '/usr/share/ansible/collections'
    resources:
      limits:
        cpu: 2000m
        memory: 3Gi
      requests:
        cpu: 2000m
        memory: 3Gi
  #   volumeMounts:
  #     - name: skynet-data
  #       mountPath: '/var/skynet-data'
  #       readOnly: false
  # volumes:
  #   - name: skynet-data
  #     persistentVolumeClaim:
  #       claimName: skynet-workspace
